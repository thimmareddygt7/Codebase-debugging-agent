services:
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: codebase-debugging-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - MODEL_PROVIDER=${MODEL_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-codebase-debugging-agent}
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
    volumes:
      - ../vector_store:/app/vector_store
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - agent-network

  ollama:
    image: ollama/ollama:latest
    container_name: codebase-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agent-network
    profiles:
      - local-llm

volumes:
  ollama_data:
    driver: local

networks:
  agent-network:
    driver: bridge
